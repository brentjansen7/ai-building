name: Deploy naar GitHub Pages

# Zet de site live bij elke push naar main, en handmatig via de Actions-tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push wacht netjes op de vorige.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Alleen wat publiek mag gaat mee. Alles wat hier niet staat — de
      # e-mail- en leadbestanden, de CEO-rapporten, de Python-scripts —
      # komt dus niet op de website terecht.
      - name: Site samenstellen
        run: |
          set -e
          mkdir -p _site
          touch _site/.nojekyll

          # Marketingpagina's en wat ze laden
          cp index.html logistiek.html horeca.html onderwijs.html zorg.html _site/
          cp style.css main.js brent.jpg _site/

          # De routeplanner (staat op zichzelf, verwijst nergens naar buiten)
          cp -r routeplanner-post _site/

          echo "Dit gaat live:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
