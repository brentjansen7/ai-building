version: "3.9"

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vastgoed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vastgoed_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepw123}
      POSTGRES_DB: vastgoed_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastgoed_user -d vastgoed_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Queue & Cache ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vastgoed-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vastgoed-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vastgoed_user:${DB_PASSWORD:-securepw123}@postgres:5432/vastgoed_ai
      DATABASE_URL_SYNC: postgresql://vastgoed_user:${DB_PASSWORD:-securepw123}@postgres:5432/vastgoed_ai
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── RQ Worker (Analysis) ─────────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vastgoed-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vastgoed_user:${DB_PASSWORD:-securepw123}@postgres:5432/vastgoed_ai
      DATABASE_URL_SYNC: postgresql://vastgoed_user:${DB_PASSWORD:-securepw123}@postgres:5432/vastgoed_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.queue.worker

  # ── RQ Scheduler ────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vastgoed-scheduler
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vastgoed_user:${DB_PASSWORD:-securepw123}@postgres:5432/vastgoed_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: python -m app.queue.worker schedule

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vastgoed-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
