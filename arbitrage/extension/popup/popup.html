<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Arbitrage Deal Finder</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status.online {
            background: #d4edda;
            color: #155724;
        }
        .status.offline {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h2>Arbitrage Detector</h2>
    <div id="status" class="status offline">
        Connecting to API...
    </div>
    <p>Scan listings on Marktplaats, Vinted, eBay and more for arbitrage opportunities.</p>
    <p id="info" style="font-size: 12px; color: #666;"></p>

    <script src="popup.js"></script>
</body>
</html>
